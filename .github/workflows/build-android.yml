name: Build Android

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build signed APK (ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Tune Gradle for CI
        # gradle.properties پروژه برای محیط کم‌حافظه تنظیم شده است؛
        # روی CI با RAM کافی تنظیمات سریع‌تر را جایگزین می‌کنیم
        # و مسیرهای مخصوص آن محیط (NDK جعلی) را حذف می‌کنیم.
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          sed -i '/^org.gradle.workers.max=1/d' android/gradle.properties
          sed -i '/^kotlin.compiler.execution.strategy=in-process/d' android/gradle.properties
          sed -i '/^flutter.androidSdkRoot=/d; /^flutter.installedNdkVersions=/d' android/gradle.properties
          grep -E '^(org.gradle|flutter)' android/gradle.properties || true

      - name: Restore Android SDK extras (NDK)
        # NDK برای تسک strip نمادها لازم است؛ کش می‌شود تا دفعات بعد سریع باشد
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: android-ndk-28.2.13676358

      - name: Install NDK
        run: yes | sdkmanager "ndk;28.2.13676358" > /dev/null || true

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/nobatyar-release.keystore
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=nobatyar-release.keystore
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "nobatyar-v${VERSION}-arm64.apk"
          echo "APK_NAME=nobatyar-v${VERSION}-arm64.apk" >> "$GITHUB_ENV"
          ls -la nobatyar-v*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Attach APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
